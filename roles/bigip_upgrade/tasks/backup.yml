---
# roles/bigip_upgrade/tasks/backup.yml
# Saves the running configuration, creates a UCS archive on the device,
# downloads it to the control node and verifies the local copy before any
# change is made to the device.
#
# The UCS is created on the device and downloaded in two steps rather than with
# bigip_ucs_fetch's combined create-and-fetch. That module creates the archive
# correctly but its downloader writes a 0-byte file for a large UCS while still
# reporting success (reproduced on 21.1.0.2 with a ~569 MB UCS). The create step
# below still uses the module (only_create_file), and files/bigip_download_ucs.py
# does the download over the same REST endpoint, chunked and verified.

- name: Save running configuration to disk before creating the UCS
  f5networks.f5_modules.bigip_command:
    provider: "{{ provider }}"
    commands:
      - save sys config
    warn: false
  delegate_to: localhost
  changed_when: true
  when: ucs_save_config_first | bool

# Timestamp to the second so a re-run the same day creates a fresh archive
# rather than reusing an earlier one of the same name.
- name: Set UCS filename fact
  ansible.builtin.set_fact:
    ucs_filename: "pre-upgrade-{{ bigip_device_hostname }}-{{ now(utc=true, fmt='%Y%m%d-%H%M%S') }}.ucs"
    ucs_local_dir: "{{ ucs_backup_dest }}/{{ bigip_device_hostname }}"

- name: Create local UCS backup directory
  ansible.builtin.file:
    path: "{{ ucs_local_dir }}"
    state: directory
    mode: "0750"
  delegate_to: localhost

# The UCS is created with 'tmsh save sys ucs', run synchronously over iControl
# REST, because that is the only method proven to work end to end on a large
# archive:
#   - bigip_ucs_fetch polls the save task's _taskState and never sees COMPLETED
#     on a long save, so it reports "Module timeout reached" and abandons a job
#     the device is still running.
#   - Driving the same task API directly (POST the task, then
#     PUT _taskState: VALIDATING) starts the save — the iApps pre-save hook runs
#     — but it then stops without writing an archive and leaves no error.
#   - 'tmsh save sys ucs <name>' writes the archive reliably (verified on a lab
#     21.1.0.2 with a 544 MB UCS).
# The command blocks until the archive is written, so the provider timeout is
# raised to ucs_async_timeout for this task only. tmsh appends the .ucs
# extension itself, so the name is passed without it.
- name: Create the UCS on the device
  f5networks.f5_modules.bigip_command:
    provider: "{{ provider | combine({'timeout': ucs_async_timeout | int}) }}"
    commands: "{{ [ucs_save_command] }}"
    warn: false
  delegate_to: localhost
  no_log: true                 # command carries ucs_encryption_password when set
  register: ucs_create
  changed_when: true
  vars:
    ucs_save_command: >-
      save sys ucs {{ ucs_filename | regex_replace('\.ucs$', '') }}
      {{ ('passphrase ' ~ ucs_encryption_password)
         if (ucs_encryption_password | default('') | length > 0) else '' }}

# The save above is synchronous, so the archive should already be listed. A
# short poll absorbs any lag in the device refreshing its UCS list, and fails
# quickly (rather than after the full create window) if nothing was written.
- name: Confirm the UCS is listed on the device
  ansible.builtin.uri:
    url: "https://{{ bigip_mgmt_host }}:{{ bigip_server_port }}/mgmt/tm/sys/ucs"
    method: GET
    url_username: "{{ bigip_username }}"
    url_password: "{{ bigip_password }}"   # marked no_log inside the uri module
    force_basic_auth: true
    validate_certs: "{{ bigip_validate_certs }}"
    return_content: true
    status_code: 200
    timeout: "{{ bigip_api_timeout }}"
  delegate_to: localhost
  register: ucs_listing
  until: ucs_filename in (ucs_listing.content | default(''))
  retries: "{{ ucs_confirm_retries }}"
  delay: "{{ ucs_create_poll_interval }}"
  changed_when: false

- name: Download the UCS to the control node in chunks
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/bigip_download_ucs.py"
      - "--host={{ bigip_mgmt_host }}"
      - "--port={{ bigip_server_port }}"
      - "--user={{ bigip_username }}"
      - "--path={{ bigip_ucs_download_path }}"
      - "--name={{ ucs_filename }}"
      - "--dest={{ ucs_local_dir }}/{{ ucs_filename }}"
      - "--chunk={{ bigip_ucs_download_chunk_size }}"
      - "--retries={{ bigip_upload_retries }}"
      - "--timeout={{ bigip_api_timeout }}"
      - "--validate-certs={{ bigip_validate_certs | string }}"
    stdin: "{{ bigip_password }}"
  delegate_to: localhost
  no_log: true                 # password is on stdin — hide the task's args
  register: ucs_download
  changed_when: ucs_download.rc == 0
  failed_when: false           # handled below so the JSON message can be shown

- name: Report the UCS download result
  ansible.builtin.assert:
    that:
      - ucs_download.rc == 0
    fail_msg: >-
      UCS download from {{ inventory_hostname }} failed
      (rc={{ ucs_download.rc | default('n/a') }}):
      {{ ucs_download.stdout | default('') }} {{ ucs_download.stderr | default('') }}
    success_msg: >-
      UCS downloaded from {{ inventory_hostname }}: {{ ucs_download.stdout | default('') }}

- name: Stat the downloaded UCS on the control node
  ansible.builtin.stat:
    path: "{{ ucs_local_dir }}/{{ ucs_filename }}"
    get_checksum: false
  register: ucs_local
  delegate_to: localhost

# A backup that was never written, or is empty, is no backup.
- name: Assert the UCS backup exists locally and is non-empty
  ansible.builtin.assert:
    that:
      - ucs_local.stat.exists
      - ucs_local.stat.size > 0
    fail_msg: >-
      UCS backup for {{ inventory_hostname }} was not written to
      {{ ucs_local_dir }}/{{ ucs_filename }} or is empty.
      Aborting before any change is made to the device.
    success_msg: >-
      UCS backup for {{ inventory_hostname }} saved to
      {{ ucs_local_dir }}/{{ ucs_filename }} ({{ ucs_local.stat.size }} bytes).

- name: Remove the UCS from the device now that it is safely fetched
  f5networks.f5_modules.bigip_ucs:
    provider: "{{ provider }}"
    ucs: "{{ ucs_filename }}"
    state: absent
  delegate_to: localhost
  when: ucs_remove_from_device | bool
