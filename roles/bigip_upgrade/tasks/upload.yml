---
# roles/bigip_upgrade/tasks/upload.yml
# Uploads the signature, then the ISO, then requires the device to report the
# image as verified.
#
# The signature is uploaded first so it is already in /shared/images when the
# BIG-IP parses the ISO. Both go to the iControl REST file-transfer endpoint.
#
# The ISO is uploaded by roles/bigip_upgrade/files/bigip_upload_image.py rather
# than f5networks.f5_modules.bigip_software_image. That module's uploader
# corrupts the transfer on any mid-stream error and then fails with "Failed to
# upload file too many times", leaving stale chunk state on the device that
# blocks retries until restjavad is restarted (see docs/ENGINEERING.md). The
# script sends correctly-ranged chunks, retries each chunk in place, keeps the
# password on stdin (never argv), and honours bigip_validate_certs.

- name: Ensure BIG-IP is ready before upload
  f5networks.f5_modules.bigip_wait:
    provider: "{{ provider }}"
    timeout: "{{ bigip_upload_wait_timeout }}"
  delegate_to: localhost

- name: Gather software images already on the device
  f5networks.f5_modules.bigip_device_info:
    gather_subset:
      - software-images
    provider: "{{ provider }}"
  delegate_to: localhost
  register: image_info_pre

# Re-runs and the staged-then-reboot workflow must not re-upload 3+ GB.
- name: Determine whether the ISO is already on the device
  ansible.builtin.set_fact:
    iso_already_present: >-
      {{
        image_info_pre.software_images | default([])
        | selectattr('name', 'equalto', iso_image_name | basename)
        | list | length > 0
      }}

- name: Report that the ISO is already present
  ansible.builtin.debug:
    msg: "{{ iso_image_name | basename }} is already on {{ inventory_hostname }}; skipping upload."
  when: iso_already_present | bool

# Single-chunk upload; preflight asserts the .sig is under the 1 MiB chunk
# limit of the iControl REST file-transfer protocol.
- name: Upload ISO signature file to the device
  ansible.builtin.uri:
    url: "https://{{ bigip_mgmt_host }}:{{ bigip_server_port }}{{ bigip_sig_upload_path }}/{{ iso_sig_name | basename }}"
    method: POST
    url_username: "{{ bigip_username }}"
    url_password: "{{ bigip_password }}"   # marked no_log inside the uri module
    force_basic_auth: true
    validate_certs: "{{ bigip_validate_certs }}"
    headers:
      Content-Type: application/octet-stream
      Content-Range: "0-{{ iso_sig_stat.stat.size - 1 }}/{{ iso_sig_stat.stat.size }}"
    src: "{{ iso_sig_name }}"
    status_code: 200
    timeout: "{{ bigip_api_timeout }}"
  delegate_to: localhost
  register: sig_upload
  changed_when: true
  when: not iso_already_present | bool

- name: Upload the ISO to the device in chunks
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/bigip_upload_image.py"
      - "--host={{ bigip_mgmt_host }}"
      - "--port={{ bigip_server_port }}"
      - "--user={{ bigip_username }}"
      - "--path={{ bigip_sig_upload_path }}"
      - "--file={{ iso_image_name }}"
      - "--chunk={{ bigip_upload_chunk_size }}"
      - "--retries={{ bigip_upload_retries }}"
      - "--timeout={{ bigip_api_timeout }}"
      - "--validate-certs={{ bigip_validate_certs | string }}"
    stdin: "{{ bigip_password }}"
  delegate_to: localhost
  no_log: true                 # password is on stdin — hide the task's args
  register: iso_upload
  changed_when: iso_upload.rc == 0
  failed_when: false           # handled below so the JSON message can be shown
  when: not iso_already_present | bool

- name: Report the ISO upload result
  ansible.builtin.assert:
    that:
      - iso_upload.rc == 0
    fail_msg: >-
      ISO upload to {{ inventory_hostname }} failed (rc={{ iso_upload.rc | default('n/a') }}):
      {{ iso_upload.stdout | default('') }} {{ iso_upload.stderr | default('') }}
      A message mentioning a stale or partial upload (HTTP 4xx) means an earlier
      interrupted upload left state on the device. Clear it with:
      rm -f /shared/images/tmp/{{ iso_image_name | basename }} /shared/images/{{ iso_image_name | basename }}
      && bigstart restart restjavad — then re-run.
    success_msg: >-
      {{ iso_image_name | basename }} uploaded to {{ inventory_hostname }}:
      {{ iso_upload.stdout | default('') }}
  when: not iso_already_present | bool

# Give the BIG-IP a moment to parse the freshly uploaded ISO into a software
# image resource before asserting on it.
- name: Gather software images after upload
  f5networks.f5_modules.bigip_device_info:
    gather_subset:
      - software-images
    provider: "{{ provider }}"
  delegate_to: localhost
  register: image_info
  until: >-
    image_info.software_images | default([])
    | selectattr('name', 'equalto', iso_image_name | basename)
    | list | length > 0
  retries: 12
  delay: 5

- name: Debug — software images on device
  ansible.builtin.debug:
    var: image_info.software_images
  when: debug_mode | bool

# 'verified' is the device's own signature check result for the image
# (tmsh show sys software image). Fail closed unless the operator has
# explicitly turned the requirement off.
- name: Assert the uploaded image is present and verified by the device
  ansible.builtin.assert:
    that:
      - uploaded | length == 1
      - (not bigip_require_verified_image | bool) or (uploaded[0].verified | default('no') | string | lower in ['yes', 'true'])
    fail_msg: >-
      Image check FAILED on {{ inventory_hostname }}:
      {{ iso_image_name | basename }} present: {{ uploaded | length == 1 }},
      verified: {{ (uploaded | map(attribute='verified') | list) if uploaded | length > 0 else 'n/a' }}.
      The device did not report the image as signature-verified. Check with
      'tmsh show sys software image' that the ISO and its .384.sig are both in
      /shared/images and that the .sig matches this ISO. Only after verifying
      the image by other means, re-run with -e bigip_require_verified_image=false.
    success_msg: >-
      {{ iso_image_name | basename }} is on {{ inventory_hostname }}
      (verified: {{ uploaded[0].verified | default('n/a') }}).
  vars:
    uploaded: >-
      {{
        image_info.software_images
        | selectattr('name', 'equalto', iso_image_name | basename)
        | list
      }}
