---
# roles/bigip_upgrade/tasks/ha_interlock.yml
# Shared by reboot.yml and rollback.yml. Re-reads HA state immediately
# before a reboot and refuses to reboot the ACTIVE member of a device group
# unless the operator opted into automatic failover or an active reboot.
# Standalone devices always report 'active' and are exempt.

- name: Gather HA state before reboot
  f5networks.f5_modules.bigip_device_info:
    gather_subset:
      - devices
      - sync-status
    provider: "{{ provider }}"
  delegate_to: localhost
  register: ha_info

- name: Set HA facts
  ansible.builtin.set_fact:
    bigip_ha_mode: "{{ (ha_info.sync_status | first).mode | default('unknown') }}"
    bigip_failover_state: >-
      {{
        (ha_info.devices | selectattr('self', 'equalto', 'yes') | first).failover_state
        | default('unknown')
      }}

- name: Show HA state
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: mode {{ bigip_ha_mode }},
      failover state {{ bigip_failover_state }}.

- name: Fail the active unit over to standby (bigip_auto_failover)
  f5networks.f5_modules.bigip_command:
    provider: "{{ provider }}"
    commands:
      - run sys failover standby
    warn: false
  delegate_to: localhost
  changed_when: true
  when:
    - bigip_ha_mode == 'high-availability'
    - bigip_failover_state == 'active'
    - bigip_auto_failover | bool

- name: Wait for the unit to leave the active state
  f5networks.f5_modules.bigip_device_info:
    gather_subset:
      - devices
    provider: "{{ provider }}"
  delegate_to: localhost
  register: ha_info_post
  retries: "{{ bigip_failover_wait_retries }}"
  delay: "{{ bigip_failover_wait_delay }}"
  until: >-
    (ha_info_post.devices | selectattr('self', 'equalto', 'yes') | first).failover_state
    | default('unknown') != 'active'
  when:
    - bigip_ha_mode == 'high-availability'
    - bigip_failover_state == 'active'
    - bigip_auto_failover | bool

- name: Update failover state after failover
  ansible.builtin.set_fact:
    bigip_failover_state: >-
      {{
        (ha_info_post.devices | selectattr('self', 'equalto', 'yes') | first).failover_state
        | default('unknown')
      }}
  when: ha_info_post is not skipped

- name: Refuse to reboot the active member of a device group unless allowed
  ansible.builtin.assert:
    that:
      - bigip_ha_mode != 'high-availability'
        or bigip_failover_state != 'active'
        or bigip_allow_active_reboot | bool
    fail_msg: >-
      {{ inventory_hostname }} is the ACTIVE member of its device group
      (failover state '{{ bigip_failover_state }}'). Rebooting it now would
      interrupt traffic. Fail it over to standby first, set
      bigip_auto_failover=true to have the play do that, or set
      bigip_allow_active_reboot=true to accept the traffic impact.
    success_msg: >-
      {{ inventory_hostname }} ({{ bigip_ha_mode }}, {{ bigip_failover_state }})
      is safe to reboot.
