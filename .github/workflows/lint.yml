---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: yamllint, ansible-lint, syntax-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and linters
        # Pin to the supported ansible-core range (matches the README). An
        # unbounded install pulls bleeding-edge releases; 2.21.x carries an
        # ansible-galaxy response-cache regression that breaks the install below.
        run: pip install "ansible-core>=2.16,<2.18" ansible-lint yamllint

      - name: Install collection dependencies
        # --no-cache avoids the ansible-galaxy response-cache corruption seen on
        # the hosted runners; the cache gives nothing on a fresh runner anyway.
        run: ansible-galaxy collection install -r requirements.yml --no-cache

      - name: Run yamllint
        run: yamllint --strict .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Syntax-check the playbook
        run: >
          ansible-playbook upgrade_bigip.yml --syntax-check
          -e bigip_username=x -e bigip_password=x

      - name: Run role logic tests (no device required)
        run: ansible-playbook tests/logic_test.yml
