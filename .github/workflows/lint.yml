---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: yamllint, ansible-lint, syntax-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and linters
        run: pip install "ansible-core>=2.16" ansible-lint yamllint

      - name: Install collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: yamllint --strict .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Syntax-check the playbook
        run: >
          ansible-playbook upgrade_bigip.yml --syntax-check
          -e bigip_username=x -e bigip_password=x

      - name: Run role logic tests (no device required)
        run: ansible-playbook tests/logic_test.yml
