# inventory/hosts.ini
#
# The playbook runs serial: 1, so hosts are processed strictly in the order
# they appear here: every host in bigip_primary completes and is verified
# before the first host in bigip_secondary starts.
#
# HA pairs: list the STANDBY member of each pair in bigip_primary and the
# ACTIVE member in bigip_secondary. Between the two runs, fail over so the
# freshly upgraded unit carries traffic (see docs/OPERATIONS.md).
#
# Each entry may be an IP or a name; use ansible_host= when the inventory
# name differs from the management address. The name is also used for the
# UCS backup folder.

[bigip_primary]
# bigip-a.example.com ansible_host=192.0.2.10

[bigip_secondary]
# bigip-b.example.com ansible_host=192.0.2.11

# Combined group targeted by the playbook (hosts: bigip)
[bigip:children]
bigip_primary
bigip_secondary
